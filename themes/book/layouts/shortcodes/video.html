<!-- prettier-ignore -->
{{- $src := .Get "src" -}}
{{- $local := .Get "isLocalSrc" | default false -}}
{{- $width := .Get "width" | default "100%" -}}
<video width="{{ $width }}" controls>
  {{- if $local -}}
  <source src="{{ .Site.BaseURL }}{{ $src }}" type="video/mp4" />
  {{- else -}}
  <source src="{{ $src }}" type="video/mp4" />
  {{- end -}}
</video>
