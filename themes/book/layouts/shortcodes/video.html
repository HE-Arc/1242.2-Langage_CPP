<!-- prettier-ignore -->
{{- $src := .Get "src" -}}
{{- $local := not (or (eq (substr $src 0 7) "http://") (eq (substr $src 0 8) "https://")) -}}
{{- $width := .Get "width" | default "100%" -}}
<video style="width: {{ $width }}" controls>
  {{- if $local -}}
  <source src="{{ $src | absURL }}" type="video/mp4" />
  {{- else -}}
  <source src="{{ $src }}" type="video/mp4" />
  {{- end -}}
</video>
